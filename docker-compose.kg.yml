# 知识图谱 Docker 配置
# Neo4j 图数据库服务
version: '3.8'

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: neo4j-ai-studio
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j HTTP 端口
      - "7687:7687"   # Neo4j Bolt 端口
    environment:
      # Neo4j 配置
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g
      # 允许写入
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/import
      - ./data/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -N http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 可选：Neo4j Browser 前端 (内置在 7474 端口中)
  # 无需额外服务

networks:
  default:
    name: ai-studio-network